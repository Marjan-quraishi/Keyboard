<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<div class="container">

    <section class="editor">

        <div class="editor-header">

            <h3>
                <span class="edit-icon">✎</span>
                TEXT EDITOR
            </h3>

            <span class="live">● LIVE</span>

        </div>

        <textarea
            id="textInput"
            placeholder="Start typing here..."
            spellcheck="false"
        ></textarea>

        <div class="editor-footer">

            <span id="charCount">0 characters</span>

            <div class="buttons">

                <button id="copyBtn" class="copy-btn">
                    Copy Text
                </button>

                <button id="clearBtn" class="clear-btn">
                    Clear All
                </button>

            </div>

        </div>

    </section>


    <!-- Keyboard -->
    <section class="keyboard-section">

        <div class="keyboard-header">

            <div>
                <h3>Virtual Keyboard</h3>
                <p>English · QWERTY Layout</p>
            </div>

            <span class="active">● ACTIVE</span>

        </div>


        <div class="keyboard">

            <!-- Row 1 -->
            <div class="key-row">

                <button class="key" data-key="`">`</button>
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key" data-key="0">0</button>
                <button class="key" data-key="-">-</button>
                <button class="key" data-key="=">=</button>
                <button class="key special wide" data-key="Backspace">⌫</button>

            </div>


            <!-- Row 2 -->
            <div class="key-row">

                <button class="key special wide" data-key="Tab">Tab</button>
                <button class="key" data-key="q">Q</button>
                <button class="key" data-key="w">W</button>
                <button class="key" data-key="e">E</button>
                <button class="key" data-key="r">R</button>
                <button class="key" data-key="t">T</button>
                <button class="key" data-key="y">Y</button>
                <button class="key" data-key="u">U</button>
                <button class="key" data-key="i">I</button>
                <button class="key" data-key="o">O</button>
                <button class="key" data-key="p">P</button>
                <button class="key" data-key="[">[</button>
                <button class="key" data-key="]">]</button>
                <button class="key" data-key="\\">\</button>

            </div>


            <!-- Row 3 -->
            <div class="key-row">
                <button class="key special extra-wide" data-key="CapsLock">Caps</button>
                <button class="key" data-key="a">A</button>
                <button class="key" data-key="s">S</button>
                <button class="key" data-key="d">D</button>
                <button class="key" data-key="f">F</button>
                <button class="key" data-key="g">G</button>
                <button class="key" data-key="h">H</button>
                <button class="key" data-key="j">J</button>
                <button class="key" data-key="k">K</button>
                <button class="key" data-key="l">L</button>
                <button class="key" data-key=";">;</button>
                <button class="key" data-key="'">'</button>
                <button class="key special extra-wide" data-key="Enter">Enter</button>

            </div>


            <!-- Row 4 -->
            <div class="key-row">

                <button class="key special extra-wide" data-key="Shift">Shift</button>
                <button class="key" data-key="z">Z</button>
                <button class="key" data-key="x">X</button>
                <button class="key" data-key="c">C</button>
                <button class="key" data-key="v">V</button>
                <button class="key" data-key="b">B</button>
                <button class="key" data-key="n">N</button>
                <button class="key" data-key="m">M</button>
                <button class="key" data-key=",">,</button>
                <button class="key" data-key=".">.</button>
                <button class="key" data-key="/">/</button>
                <button class="key special extra-wide" data-key="Shift">Shift</button>

            </div>


            <!-- Row 5 -->
            <div class="key-row bottom-row">

                <button class="key special" data-key="Control">Ctrl</button>
                <button class="key special" data-key="Alt">Alt</button>
                <button class="key space" data-key=" ">Space</button>
                <button class="key special" data-key="Alt">Alt</button>
                <button class="key special" data-key="Control">Ctrl</button>

            </div>

        </div>


        <div class="keyboard-footer">

            <span>Designed for comfortable typing</span>
            <span>KEYORA © 2026</span>

        </div>

    </section>


   




<script src="script.js"></script>
</body>
</html>
